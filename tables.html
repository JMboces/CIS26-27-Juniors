    <title>HTML Tables</title>

    <body>
        <h1>html tables</h1>\
        <h2> the table element</h2>
        <p><Strong>&lt;table &gt;</Strong> - this is the element that creates and html table <strong>html tables are used to organize data into rows and columns.</strong></p>
        
        <h2>Cell</h2>
        <p><strong>&lt;cell&gt;</strong> - it is a location in the table at a specific row and column. cells are created at the intersection of a row and column.</p>
